name: postmerge-ci

# This is the single entrypoint for main-only CI that is intentionally outside
# the merge-blocking suite. It keeps the broader postmerge signal in one run.
on:
  push:
    branches: [main]

# The called v8-canary workflow's `build` job requests `actions: read` (it
# downloads its own artifacts). GitHub validates a nested job's requests against
# what the caller grants, and this repository's default workflow token is
# read-only (`contents: read`, everything else `none`), so the reusable-workflow
# call never started and the whole run was a startup failure:
#
#   The nested job 'build' is requesting 'actions: read',
#   but is only allowed 'actions: none'.
#
# Grant it here. Upstream does not need this block because openai/codex's
# repository default already allows `actions: read`.
permissions:
  actions: read
  contents: read

jobs:
  # Keep reusable workflow calls alphabetized. Each child retains its own
  # workflow_dispatch trigger so maintainers can rerun flaky suites directly.
  rust-ci-full:
    name: rust-ci-full
    uses: ./.github/workflows/rust-ci-full.yml
    secrets: inherit

  v8-canary:
    name: v8-canary
    uses: ./.github/workflows/v8-canary.yml
    secrets: inherit

  results:
    name: Postmerge CI results
    needs:
      - rust-ci-full
      - v8-canary
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      # Postmerge runs use the pushed main commit, so this helper always comes
      # from the same revision that defined the parent workflow.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py

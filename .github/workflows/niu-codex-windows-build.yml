name: niu-codex-windows-build

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: "Artifact name"
        required: false
        default: "niu-codex-preview-windows-x86_64"
      release_tag:
        description: "Optional GitHub release tag to upload the zip to"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64 preview
    runs-on: windows-latest
    timeout-minutes: 120
    # A cold build occupies a runner for about an hour. Never run two builds at
    # once: they compete for the same cache entries.
    concurrency:
      group: niu-codex-windows-build
      cancel-in-progress: false
    env:
      # Incremental artifacts are useless across CI jobs and only inflate the cache.
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      # Cache keys cover what changes the *dependency* build: the lockfile, the
      # toolchain and the rustflags in .cargo/config.toml. Source changes must not
      # be part of the key, so that a new commit still hits this cache -- cargo's
      # own fingerprints decide what to rebuild from it.
      - name: Compute cache key
        id: cachekey
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=$(cat Cargo.lock rust-toolchain.toml .cargo/config.toml | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore cargo home cache
        id: cargo_home_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-windows-x64-${{ steps.cachekey.outputs.hash }}
          restore-keys: |
            cargo-home-windows-x64-

      # Cache the compiled dependency artifacts directly. Read the two exclusions
      # before adding paths:
      #
      # - Do NOT cache target/.../release/build. Restoring a build script's
      #   OUT_DIR alongside a fresh checkout left the v8 crate unable to find its
      #   `rusty_v8` static library and the build died at the link. Build scripts
      #   are cheap; let them re-run.
      # - Do NOT wrap rustc with sccache; it was measurably worse because its
      #   hashing and storing land on the long thin-LTO link.
      #
      # The key carries a version so a cache written by an earlier set of paths
      # can never be restored.
      - name: Restore build cache
        id: build_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            codex-rs/target/x86_64-pc-windows-msvc/release/deps
            codex-rs/target/x86_64-pc-windows-msvc/release/.fingerprint
          key: build-msvc-target-windows-x64-v2-${{ steps.cachekey.outputs.hash }}
          restore-keys: |
            build-msvc-target-windows-x64-v2-

      # Two separate invocations, deliberately: one invocation unifies the feature
      # sets of both packages and the shared dependency build grows with it.
      # --timings writes the per-unit breakdown so compile time can be told apart
      # from link time; each invocation overwrites the file, so keep a copy.
      - name: Build Codex CLI and sandbox helpers
        id: build
        shell: pwsh
        run: |
          $timings = "target/cargo-timings"
          cargo build --target x86_64-pc-windows-msvc --release --timings --package codex-cli --bin codex
          Copy-Item "$timings/cargo-timing.html" "$timings/timings-1-codex-cli.html"
          cargo build --target x86_64-pc-windows-msvc --release --timings --package codex-windows-sandbox --bins
          Copy-Item "$timings/cargo-timing.html" "$timings/timings-2-sandbox.html"

      - name: Upload Cargo timings
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-niu-windows-x64-preview
          # uses: steps resolve from the repo root, not from the job's
          # defaults.run.working-directory. cargo may write these under the target
          # triple directory, so glob for it.
          path: codex-rs/target/**/cargo-timings/*.html
          if-no-files-found: warn

      - name: Save cargo home cache
        if: always() && !cancelled() && steps.cargo_home_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-windows-x64-${{ steps.cachekey.outputs.hash }}

      # Save only after a successful build, and only on a miss. Saving a partial
      # dependency tree under the lockfile key would make it permanent: an exact
      # key can never be overwritten, so the cache would stay incomplete for the
      # life of that lockfile.
      - name: Save build cache
        if: always() && !cancelled() && steps.build.outcome == 'success' && steps.build_cache_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            codex-rs/target/x86_64-pc-windows-msvc/release/deps
            codex-rs/target/x86_64-pc-windows-msvc/release/.fingerprint
          key: build-msvc-target-windows-x64-v2-${{ steps.cachekey.outputs.hash }}

      - name: Stage zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifactName = "${{ inputs.artifact_name }}"
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "codex-rs\target\x86_64-pc-windows-msvc\release"
          $stageRoot = Join-Path $env:RUNNER_TEMP $artifactName
          $stageDir = Join-Path $stageRoot $artifactName
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          Copy-Item (Join-Path $releaseDir "codex.exe") $stageDir
          Copy-Item (Join-Path $releaseDir "codex-command-runner.exe") $stageDir
          Copy-Item (Join-Path $releaseDir "codex-windows-sandbox-setup.exe") $stageDir
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "README.md") $stageDir
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "RELEASE.md") $stageDir

          $zipPath = Join-Path $env:GITHUB_WORKSPACE "$artifactName.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path $stageDir -DestinationPath $zipPath -CompressionLevel Optimal
          "ZIP_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

      - name: Upload release asset
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          prerelease: true
          files: ${{ env.ZIP_PATH }}
